services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: orderpilot-postgres
    environment:
      POSTGRES_DB: orderpilot
      POSTGRES_USER: orderpilot
      POSTGRES_PASSWORD: orderpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: orderpilot-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: orderpilot-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: orderpilot
      MONGO_INITDB_ROOT_PASSWORD: orderpilot
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: orderpilot-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: orderpilot
      RABBITMQ_DEFAULT_PASS: orderpilot
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata: